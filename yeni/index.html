<div id="app" data-mode="tasarim" data-sheet="closed">

  <header id="top">
    <button class="ui ib" data-ui="menu" aria-label="Menü" title="Menü"><svg><use href="#i-menu"/></svg></button>
    <div class="brand d-only"><span class="logo"><svg><use href="#i-cube"/></svg></span><b>Çizim Atölyesi</b></div>
    <div id="title"><b id="t-name">Model</b><small id="t-sub">Yükleniyor</small></div>
    <nav id="nav" aria-label="Bölümler">
      <button class="ui" data-mode="tasarim" aria-current="page"><svg><use href="#i-cube"/></svg><span>Tasarım</span></button>
      <button class="ui" data-mode="analiz"><svg><use href="#i-chart"/></svg><span>Analiz</span></button>
      <button class="ui" data-mode="uretim"><svg><use href="#i-cnc"/></svg><span>Üretim</span></button>
      <a class="ui" data-mode="tekstil" href="../tekstil.html"><svg><use href="#i-scissors"/></svg><span>Tekstil</span></a>
    </nav>
    <button class="ui search" data-ui="search" aria-label="Komut ara" title="Komut ara (Ctrl K)"><svg><use href="#i-search"/></svg><span class="d-only">Komut ara</span><kbd class="d-only">Ctrl K</kbd></button>
    <button id="b-undo" class="ui ib" data-act="undo" aria-label="Geri al" title="Geri al"><svg><use href="#i-undo"/></svg></button>
    <button id="b-redo" class="ui ib" data-act="redo" aria-label="İleri al" title="İleri al"><svg><use href="#i-redo"/></svg></button>
    <button class="ui ib d-only" data-act="projects" aria-label="Projeler" title="Projeler: kaydet, aç"><svg><use href="#i-folder"/></svg></button>
    <button id="b-mic" class="ui ib d-only" data-act="mic" aria-label="Sesli komut" title="Sesli komut"><svg><use href="#i-mic"/></svg></button>
    <button class="ui ib d-only" data-act="guide" aria-label="Rehber ve örnekler" title="Rehber ve örnekler"><svg><use href="#i-help"/></svg></button>
    <button class="ui primary d-only" data-act="stl" title="3B yazıcı için STL indir"><svg><use href="#i-download"/></svg>STL indir</button>
  </header>

  <aside id="tools" aria-label="Araçlar">
    <div class="tools-head p-only"><b>Araçlar</b><button class="ui ib" data-ui="close" aria-label="Araçları kapat"><svg><use href="#i-close"/></svg></button></div>
    <h3>ŞEKİL EKLE</h3>
    <div class="tgrid">
      <button class="ui tool" data-act="add-box"><svg><use href="#i-cube"/></svg><span>Kutu</span></button>
      <button class="ui tool" data-act="add-cylinder"><svg><use href="#i-cyl"/></svg><span>Silindir</span></button>
      <button class="ui tool" data-act="add-sphere"><svg><use href="#i-sphere"/></svg><span>Küre</span></button>
      <button class="ui tool" data-act="add-cone"><svg><use href="#i-cone"/></svg><span>Koni</span></button>
      <button class="ui tool" data-act="add-tube"><svg><use href="#i-tube"/></svg><span>Boru</span></button>
      <button class="ui tool" data-act="add-gear"><svg><use href="#i-gear"/></svg><span>Dişli</span></button>
    </div>
    <h3>OLUŞTUR</h3>
    <div class="tlist">
      <button class="ui trow" data-act="sketch-new"><svg><use href="#i-pen"/></svg>Kroki çiz</button>
      <button class="ui trow" data-act="add-sweep"><svg><use href="#i-sweep"/></svg>Süpürme</button>
      <button class="ui trow" data-act="add-loft"><svg><use href="#i-loft"/></svg>Loft</button>
      <button class="ui trow" data-act="add-sheet"><svg><use href="#i-sheet"/></svg>Sac metal</button>
      <button class="ui trow" data-act="add-frame"><svg><use href="#i-frame"/></svg>Konstrüksiyon</button>
      <button class="ui trow" data-act="cad2d"><svg><use href="#i-draw"/></svg>2B çizim</button>
    </div>
    <h3>DELİK</h3>
    <div class="tlist">
      <button class="ui trow" data-act="hole-round"><svg><use href="#i-hole"/></svg>Yuvarlak delik</button>
      <button class="ui trow" data-act="hole-square"><svg><use href="#i-sqhole"/></svg>Kare delik</button>
    </div>
  </aside>

  <section id="parts" aria-label="Parçalar">
    <h3 class="d-only">PARÇALAR</h3>
    <div id="chips"></div>
  </section>

  <main id="stage">
    <div id="view">
      <div id="msg">3B yükleniyor…</div>
      <div id="measure"></div>
      <div id="toast"></div>
    </div>
    <div id="floats">
      <button class="ui ib" data-act="fit" aria-label="Ekrana sığdır" title="Ekrana sığdır"><svg><use href="#i-fit"/></svg></button>
      <button id="b-move" class="ui ib" data-act="move" aria-label="Taşı" title="Parçayı sürükleyerek taşı"><svg><use href="#i-move"/></svg></button>
      <button class="ui ib p-only" data-ui="props" aria-label="Özellikler paneli" title="Özellikler"><svg><use href="#i-sliders"/></svg></button>
    </div>
    <div id="dock" class="p-only">
      <button class="ui" data-act="add-box"><svg><use href="#i-cube"/></svg><span>Kutu</span></button>
      <button class="ui" data-act="add-cylinder"><svg><use href="#i-cyl"/></svg><span>Silindir</span></button>
      <button class="ui" data-act="sketch-new"><svg><use href="#i-pen"/></svg><span>Kroki</span></button>
      <button class="ui" data-act="hole-round"><svg><use href="#i-hole"/></svg><span>Delik</span></button>
      <button class="ui" data-ui="tools"><svg><use href="#i-grid"/></svg><span>Tümü</span></button>
    </div>
  </main>

  <section id="panelwrap" aria-label="Özellikler">
    <div id="sheethead">
      <button class="ui grab p-only" data-ui="sheet-cycle" aria-label="Paneli büyüt ya da küçült"><span></span></button>
      <div class="sh-row">
        <div class="sh-title"><b id="sh-name">Özellikler</b><small id="sh-sub"></small></div>
        <button id="sh-del" class="ui ib danger-ic" data-act="del" aria-label="Seçili parçayı sil" title="Seçili parçayı sil"><svg><use href="#i-trash"/></svg></button>
        <button class="ui ib p-only" data-ui="sheet-close" aria-label="Paneli kapat"><svg><use href="#i-close"/></svg></button>
      </div>
    </div>
    <div id="panel">
      <div class="row" id="tabs"></div>
      <div class="row wrap" id="tabbody"></div>
      <div class="lbl" id="tabhint"></div>
    </div>
  </section>

  <button id="b-panel" data-act="panel" hidden>Panel</button>
  <div id="scrim" data-ui="close"></div>

  <div id="menu" role="dialog" aria-label="Menü">
    <div class="menu-head"><span class="logo"><svg><use href="#i-cube"/></svg></span><b>Çizim Atölyesi</b><button class="ui ib" data-ui="close" aria-label="Menüyü kapat"><svg><use href="#i-close"/></svg></button></div>
    <button class="ui trow" data-act="projects"><svg><use href="#i-folder"/></svg>Projeler: kaydet, aç</button>
    <button class="ui trow" data-act="guide"><svg><use href="#i-help"/></svg>Rehber ve hazır örnekler</button>
    <button class="ui trow" data-act="stl"><svg><use href="#i-download"/></svg>STL indir (3B yazıcı)</button>
    <button class="ui trow" data-act="mic"><svg><use href="#i-mic"/></svg>Sesli komut</button>
    <button class="ui trow" data-ui="search"><svg><use href="#i-search"/></svg>Komut ara</button>
    <hr>
    <a class="ui trow" href="../tekstil.html"><svg><use href="#i-scissors"/></svg>Tekstil ve Moda</a>
    <a class="ui trow" href="../tanitim/"><svg><use href="#i-home"/></svg>Tanıtım sayfası</a>
    <a class="ui trow" href="../index.html?ws=makine"><svg><use href="#i-back"/></svg>Eski arayüze dön</a>
  </div>

  <div id="palette" role="dialog" aria-label="Komut arama">
    <div class="pal-box">
      <div class="pal-in">
        <div class="pal-field"><svg><use href="#i-search"/></svg><label for="pal-q" class="sr">Komut ara</label><input id="pal-q" type="search" placeholder="Komut, araç ya da örnek ara" autocomplete="off" spellcheck="false"></div>
        <button class="ui pal-x" data-ui="close">Vazgeç</button>
      </div>
      <div id="pal-list" role="listbox" aria-label="Sonuçlar"></div>
      <p class="pal-tip d-only"><kbd>↑</kbd> <kbd>↓</kbd> seç · <kbd>Enter</kbd> çalıştır · <kbd>Esc</kbd> kapat</p>
    </div>
  </div>
</div>

<div id="dlg">
  <div id="dbox">
    <h3>Projeler</h3>
    <div class="row" style="padding:0 0 8px">
      <input id="pname" type="text" placeholder="Proje adı" style="flex:3">
      <button data-act="dlg-save" class="on" style="flex:1">Kaydet</button>
    </div>
    <div id="plist"></div>
    <div class="row" style="padding:10px 0 0">
      <button data-act="dlg-new">Yeni boş proje</button>
      <button data-act="dlg-close">Kapat</button>
    </div>
  </div>
</div>
