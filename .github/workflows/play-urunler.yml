# Google Play'de 8 abonelik ürününü açar (tools/play-urunler.mjs). Yalnız elle çalıştırılır (Actions → Play ürünleri → Run).
# Var olan ürünlere dokunmaz; fiyat değişikliği Play Console'dan bilerek yapılır.
name: Play ürünleri

on:
  workflow_dispatch:
    inputs:
      guncelle:
        description: "Var olan ürünlerin başlık ve açıklamasını da güncelle"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  urunler:
    name: Abonelik ürünleri
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Ürünleri aç / denetle
        env:
          PLAY_SERVICE_JSON: ${{ secrets.PLAY_SERVICE_JSON }}
          GUNCELLE: ${{ inputs.guncelle }}
        run: |
          if [ "$GUNCELLE" = "true" ]; then node tools/play-urunler.mjs --guncelle; else node tools/play-urunler.mjs; fi
