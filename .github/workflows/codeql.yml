name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - name: Autobuild
        uses: github/codeql-action/autobuild@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          output: codeql-sonuc
          # Gizli depoda GitHub Code Scanning ücretli (Code Security); yükleme yapılmaz, sonuç aşağıda bu işte denetlenir.
          # Depo herkese açıkken sonuçlar Güvenlik sekmesine de yüklenir.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
      - name: Bulguları iş günlüğüne yaz
        if: always()
        run: |
          for f in codeql-sonuc/*.sarif; do
            echo "CODEQL-OZET $(jq '[.runs[].results[]] | length' "$f") bulgu"
            jq -r '.runs[] as $r | $r.results[] | "CODEQL-BULGU \(.ruleId) | \(.level) | \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) | \(.message.text | gsub("\n"; " ") | .[0:200]) | kaynak: \([.relatedLocations[]? | "\(.physicalLocation.artifactLocation.uri):\(.physicalLocation.region.startLine)"] | join(", ")) | yol: \([.codeFlows[]?.threadFlows[]? | [.locations[]? | "\(.location.physicalLocation.region.startLine)"] | join(">")] | join(" ; "))"' "$f"
          done
      - name: Bulgu varsa işi durdur
        run: |
          n=0
          for f in codeql-sonuc/*.sarif; do n=$((n + $(jq '[.runs[].results[] | select((.level // "warning") != "note" and (.level // "warning") != "none")] | length' "$f"))); done
          echo "Uyarı / hata düzeyinde $n bulgu"
          if [ "$n" -gt 0 ]; then echo "::error::CodeQL $n bulgu buldu (ayrıntı: 'Bulguları iş günlüğüne yaz' adımı ve codeql-sarif dosyası)"; exit 1; fi
      - name: Sonuç dosyasını sakla (SARIF)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: codeql-sonuc
          retention-days: 14
