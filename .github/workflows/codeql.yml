name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - name: Autobuild
        uses: github/codeql-action/autobuild@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          output: codeql-sonuc
      - name: Bulguları iş günlüğüne yaz
        if: always()
        run: |
          for f in codeql-sonuc/*.sarif; do
            echo "CODEQL-OZET $(jq '[.runs[].results[]] | length' "$f") bulgu"
            jq -r '.runs[] as $r | $r.results[] | "CODEQL-BULGU \(.ruleId) | \(.level) | \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) | \(.message.text | gsub("\n"; " ") | .[0:200]) | kaynak: \([.relatedLocations[]? | "\(.physicalLocation.artifactLocation.uri):\(.physicalLocation.region.startLine)"] | join(", ")) | yol: \([.codeFlows[]?.threadFlows[]? | [.locations[]? | "\(.location.physicalLocation.region.startLine)"] | join(">")] | join(" ; "))"' "$f"
          done
      - name: Sonuç dosyasını sakla (SARIF)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-sarif
          path: codeql-sonuc
          retention-days: 14
