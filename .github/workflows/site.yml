# Çizim Atölyesi — tanıtım sitesi (GitHub Pages)
# Sitede yalnız tanıtım, gizlilik politikası, hesap silme ve hesap sayfası yayınlanır.
# Uygulamanın kendisi sitede YOK: yalnız Google Play'deki Android uygulamasında çalışır.
# Ayar (bir kez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'tanitim/**'
      - 'hesap/**'
      - '.github/workflows/site.yml'
      - 'tools/site-yazi-tipi.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    name: Tanıtım sitesini yayınla
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Site klasörünü hazırla (yalnız tanıtım + hesap sayfaları)
        run: |
          set -eu
          mkdir -p _site
          cp -r tanitim hesap _site/
          # Kök adres ve bilinmeyen adresler tanıtım sayfasına gider (eski uygulama bağlantıları dahil)
          for f in index.html 404.html; do
            cat > "_site/$f" <<'HTML'
          <!doctype html>
          <html lang="tr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Çizim Atölyesi</title>
          <meta http-equiv="refresh" content="0; url=/cizim-atolyesi/tanitim/">
          <link rel="canonical" href="/cizim-atolyesi/tanitim/">
          </head><body><p><a href="/cizim-atolyesi/tanitim/">Çizim Atölyesi</a></p></body></html>
          HTML
          done
          touch _site/.nojekyll
          find _site -type f | sort
      - name: Yazı tiplerini siteye göm (ziyaretçi Google'a bağlanmasın)
        run: node tools/site-yazi-tipi.mjs _site/tanitim/index.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
